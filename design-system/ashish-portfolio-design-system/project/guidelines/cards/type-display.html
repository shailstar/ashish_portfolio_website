<!-- @dsCard group="Type" viewport="700x230" name="Playfair Display — Display" subtitle="Expressive serif for headlines & moments" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); }
  .wrap { padding: 24px 26px; }
  .big { font-family: var(--font-display); font-weight: 600; font-size: 56px; line-height: 1.04; letter-spacing: -.015em; color: var(--text-strong); margin: 0; }
  .big i { font-style: italic; color: var(--brand); }
  .meta { margin-top: 16px; display: flex; gap: 28px; font-size: 12px; color: var(--text-muted); }
  .meta b { color: var(--text-strong); font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="big">Designing for <i>calm</i> minds</p>
    <div class="meta">
      <span><b>Playfair Display</b> · 500 / 600 / 700 / 800</span>
      <span>Regular &amp; <i style="font-family:var(--font-display)">Italic</i></span>
      <span><b>--font-display</b></span>
    </div>
  </div>
</body>
</html>
