<!-- @dsCard group="Colors" viewport="700x172" name="Stone — Warm Neutrals" subtitle="Greige paper, lines & text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); }
  .wrap { padding: 20px 22px; }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-md); height: 88px; display: flex; align-items: flex-end; padding: 10px; box-shadow: var(--shadow-xs); border: 1px solid var(--border); }
  .sw span { font-size: 11px; font-weight: 600; }
  .lab { margin-top: 8px; font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; }
  .lab b { color: var(--text-strong); font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw" style="background:var(--paper)"><span style="color:var(--stone-600)">paper</span></div>
      <div class="sw" style="background:var(--stone-50)"><span style="color:var(--stone-600)">50</span></div>
      <div class="sw" style="background:var(--stone-100)"><span style="color:var(--stone-600)">100</span></div>
      <div class="sw" style="background:var(--stone-200)"><span style="color:var(--stone-700)">200</span></div>
      <div class="sw" style="background:var(--stone-400)"><span style="color:#fff">400</span></div>
      <div class="sw" style="background:var(--stone-500)"><span style="color:#fff">500</span></div>
      <div class="sw" style="background:var(--stone-700)"><span style="color:#fff">700</span></div>
    </div>
    <div class="lab"><b>--bg-page · paper · #FAF9F3</b><span>Paper surfaces, borders, body &amp; muted text</span></div>
  </div>
</body>
</html>
