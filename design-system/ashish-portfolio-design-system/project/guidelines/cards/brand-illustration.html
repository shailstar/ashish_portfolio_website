<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); }
  .wrap { padding: 18px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { aspect-ratio: 1 / 1; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cap { margin-top: 12px; font-size: 11px; color: var(--text-muted); }
  .cap b { color: var(--text-strong); font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="grid">
      <div class="tile"><img src="../../assets/illustrations/brain-bloom-hands.jpeg" alt=""></div>
      <div class="tile"><img src="../../assets/illustrations/meditation-lotus.jpeg" alt=""></div>
      <div class="tile"><img src="../../assets/illustrations/portrait-bloom-mind.jpeg" alt=""></div>
      <div class="tile"><img src="../../assets/illustrations/mindful-bloom-okay.jpeg" alt=""></div>
    </div>
    <div class="cap"><b>Mind-in-bloom motif.</b> Hand-drawn line work, blooming brains, butterflies & hearts on warm gradient washes. Use full-bleed behind heroes or framed in soft cards.</div>
  </div>
</body>
</html>
