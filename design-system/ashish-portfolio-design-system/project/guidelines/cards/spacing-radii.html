<!-- @dsCard group="Spacing" viewport="700x172" name="Corner Radii" subtitle="Soft & rounded — nothing sharp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); }
  .wrap { padding: 20px 26px; display: flex; gap: 16px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .box { width: 76px; height: 76px; background: var(--surface-card); border: 2px solid var(--sage-300); }
  .n { font-size: 11px; color: var(--text-strong); font-weight: 600; }
  .px { font-size: 10px; color: var(--text-faint); }
  .pill { width: 110px; height: 44px; border-radius: var(--radius-pill); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="n">sm</div><div class="px">10px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="n">md</div><div class="px">16px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="n">lg</div><div class="px">24px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="n">xl</div><div class="px">32px</div></div>
    <div class="item"><div class="box pill"></div><div class="n">pill</div><div class="px">999px</div></div>
  </div>
</body>
</html>
