<!-- @dsCard group="Brand" viewport="700x200" name="Wordmark" subtitle="Playfair serif name + role line" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); }
  .wrap { padding: 28px; display: flex; gap: 24px; }
  .card { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: var(--radius-lg); padding: 26px; }
  .light { background: var(--surface-card); box-shadow: var(--shadow-sm); }
  .dark { background: var(--surface-ink); }
  .mark { font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: -.01em; }
  .mark .dot { color: var(--brand); }
  .role { font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card light">
      <div class="mark" style="color:var(--text-strong)">Ashish<span class="dot">.</span></div>
      <div class="role" style="color:var(--text-muted)">Product&nbsp;&amp;&nbsp;Brand&nbsp;Designer</div>
    </div>
    <div class="card dark">
      <div class="mark" style="color:#fff">Ashish<span class="dot">.</span></div>
      <div class="role" style="color:var(--sage-300)">Product&nbsp;&amp;&nbsp;Brand&nbsp;Designer</div>
    </div>
  </div>
</body>
</html>
