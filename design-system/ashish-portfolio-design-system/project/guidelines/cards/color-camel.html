<!-- @dsCard group="Colors" viewport="700x172" name="Camel — Secondary" subtitle="Warm tan / wheat counterpoint" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); }
  .wrap { padding: 20px 22px; }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-md); height: 88px; display: flex; align-items: flex-end; padding: 10px; box-shadow: var(--shadow-xs); }
  .sw span { font-size: 11px; font-weight: 600; }
  .lab { margin-top: 8px; font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; }
  .lab b { color: var(--text-strong); font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw" style="background:var(--camel-100)"><span style="color:var(--camel-700)">100</span></div>
      <div class="sw" style="background:var(--camel-200)"><span style="color:var(--camel-700)">200</span></div>
      <div class="sw" style="background:var(--camel-300)"><span style="color:var(--camel-700)">300</span></div>
      <div class="sw" style="background:var(--camel-400)"><span style="color:var(--camel-700)">400</span></div>
      <div class="sw" style="background:var(--camel-500)"><span style="color:#fff">500</span></div>
      <div class="sw" style="background:var(--camel-600)"><span style="color:#fff">600</span></div>
      <div class="sw" style="background:var(--camel-700)"><span style="color:#fff">700</span></div>
    </div>
    <div class="lab"><b>--secondary · camel-600 · #8A6F40</b><span>Secondary actions, tags · seed #C2A46F</span></div>
  </div>
</body>
</html>
