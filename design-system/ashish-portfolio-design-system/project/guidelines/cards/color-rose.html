<!-- @dsCard group="Colors" viewport="700x172" name="Rose — Primary" subtitle="The signature pink of every hero" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); }
  .wrap { padding: 20px 22px; }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-md); height: 88px; display: flex; align-items: flex-end; padding: 10px; box-shadow: var(--shadow-xs); }
  .sw span { font-size: 11px; font-weight: 600; letter-spacing: .02em; }
  .lab { margin-top: 8px; font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; }
  .lab b { color: var(--text-strong); font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw" style="background:var(--rose-100)"><span style="color:var(--rose-700)">100</span></div>
      <div class="sw" style="background:var(--rose-200)"><span style="color:var(--rose-700)">200</span></div>
      <div class="sw" style="background:var(--rose-300)"><span style="color:var(--rose-700)">300</span></div>
      <div class="sw" style="background:var(--rose-400)"><span style="color:#fff">400</span></div>
      <div class="sw" style="background:var(--rose-500)"><span style="color:#fff">500</span></div>
      <div class="sw" style="background:var(--rose-600)"><span style="color:#fff">600</span></div>
      <div class="sw" style="background:var(--rose-700)"><span style="color:#fff">700</span></div>
    </div>
    <div class="lab"><b>--brand · rose-500 · #E25C84</b><span>Primary actions, links, emphasis</span></div>
  </div>
</body>
</html>
