<!-- @dsCard group="Type" viewport="700x210" name="Inter — Body & UI" subtitle="Clean grotesque for reading & interface" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); }
  .wrap { padding: 22px 26px; display: grid; grid-template-columns: 1.6fr 1fr; gap: 26px; }
  p.body { font-size: 15px; line-height: 1.7; color: var(--text-body); margin: 0; max-width: 38ch; }
  .weights { display: flex; flex-direction: column; gap: 8px; }
  .w { font-size: 17px; color: var(--text-strong); }
  .w span { font-size: 11px; color: var(--text-muted); font-weight: 400; margin-left: 8px; }
  .eyebrow-demo { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--brand); }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="eyebrow-demo" style="margin-bottom:10px">Selected Work</div>
      <p class="body">Inter carries every word of running text, label, and control. It stays quiet so the serif headlines and soft artwork can lead.</p>
    </div>
    <div class="weights">
      <div class="w" style="font-weight:400">Regular<span>400</span></div>
      <div class="w" style="font-weight:500">Medium<span>500</span></div>
      <div class="w" style="font-weight:600">Semibold<span>600</span></div>
      <div class="w" style="font-weight:700">Bold<span>700</span></div>
    </div>
  </div>
</body>
</html>
