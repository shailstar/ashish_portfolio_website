<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashish — Portfolio</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg-page); }
</style>
</head>
<body>
<div id="root"></div>

<!-- Expose design-system primitives as bare globals for the kit scripts -->
<script type="text/babel" data-presets="react">
  Object.assign(window, window.AshishPortfolioDesignSystem_48f8eb);
</script>

<script type="text/babel" src="Nav.jsx" data-presets="react"></script>
<script type="text/babel" src="Hero.jsx" data-presets="react"></script>
<script type="text/babel" src="WorkGrid.jsx" data-presets="react"></script>
<script type="text/babel" src="About.jsx" data-presets="react"></script>
<script type="text/babel" src="Contact.jsx" data-presets="react"></script>
<script type="text/babel" src="Footer.jsx" data-presets="react"></script>

<script type="text/babel" data-presets="react">
  const { useState, useEffect } = React;

  function App() {
    const [route, setRoute] = useState(() => localStorage.getItem("ashish_route") || "home");
    useEffect(() => { localStorage.setItem("ashish_route", route); }, [route]);
    useEffect(() => { window.scrollTo(0, 0); }, [route]);

    return (
      <React.Fragment>
        <Nav route={route} setRoute={setRoute} />

        {route === "home" && (
          <React.Fragment>
            <Hero setRoute={setRoute} />
            <WorkGrid heading="Selected work" blurb="A few recent projects across wellness, health, and the quieter corners of tech." limit={3} />
            <About />
            <Contact />
          </React.Fragment>
        )}

        {route === "work" && (
          <WorkGrid heading="All work" blurb="Brand identities, product design, illustration systems and the occasional campaign." />
        )}

        {route === "about" && <About />}

        {route === "contact" && <Contact />}

        <Footer setRoute={setRoute} />
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
