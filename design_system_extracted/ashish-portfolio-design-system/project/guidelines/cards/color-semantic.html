<!-- @dsCard group="Colors" viewport="700x150" name="Semantic Surfaces" subtitle="How tones map to UI roles" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); }
  .wrap { padding: 18px 22px; display: flex; gap: 12px; }
  .tile { flex: 1; border-radius: var(--radius-md); padding: 14px; height: 104px; display: flex; flex-direction: column; justify-content: space-between; }
  .tile .t { font-size: 12px; font-weight: 700; }
  .tile .v { font-size: 10.5px; opacity: .8; }
  .border { border: 1px solid var(--border); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tile border" style="background:var(--bg-page)">
      <div class="t" style="color:var(--text-strong)">Page</div>
      <div class="v" style="color:var(--text-muted)">--bg-page</div>
    </div>
    <div class="tile border" style="background:var(--surface-card); box-shadow:var(--shadow-sm)">
      <div class="t" style="color:var(--text-strong)">Card</div>
      <div class="v" style="color:var(--text-muted)">--surface-card</div>
    </div>
    <div class="tile" style="background:var(--surface-tint)">
      <div class="t" style="color:var(--sage-700)">Tint</div>
      <div class="v" style="color:var(--sage-700)">--surface-tint</div>
    </div>
    <div class="tile" style="background:var(--surface-ink)">
      <div class="t" style="color:var(--text-on-dark)">Ink</div>
      <div class="v" style="color:var(--sage-300)">--surface-ink</div>
    </div>
  </div>
</body>
</html>
